version: '4'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=person_db
      - SERVER_PORT=8080
    depends_on:
      - postgres
    networks:
      - person-network

  postgres:
    image: postgres:15-alpine
    container_name: personcrud-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=person_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - person-network

volumes:
  postgres_data:

networks:
  person-network:
    driver: bridge